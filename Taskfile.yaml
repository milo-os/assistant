# Task-driven dev environment, following the datum-cloud house pattern
# (reference: milo-os/billing): a pinned remote include of
# datum-cloud/test-infra bootstraps the kind cluster + shared operators
# (cert-manager, Flux, Kyverno, Envoy Gateway); this repo layers its own stack
# on top with kustomize (config/base + components + overlays/dev) and runs
# environment e2e with chainsaw.
#
# Requires TASK_X_REMOTE_TASKFILES=1 (set in .env; task reads it via dotenv).
#
# Quickstart:
#   task dev:setup      # cluster + images + full stack (fixture capabilities)
#   task dev:forward    # port-forward the assistant to localhost:1986
#   task e2e            # chainsaw environment tests
#   task dev:redeploy   # fast loop: rebuild image, roll the assistant
version: '3'

dotenv: ['.env']

vars:
  IMAGE_ASSISTANT: ghcr.io/milo-os/assistant
  IMAGE_APISERVER: ghcr.io/milo-os/conversations-apiserver
  IMAGE_STREAMCO: ghcr.io/milo-os/assistant-streamco
  IMAGE_SINK: ghcr.io/milo-os/assistant-sink
  IMAGE_TAG: dev
  TEST_INFRA_CLUSTER_NAME: test-infra
  # v0.7.0 ships Envoy Gateway v1.8.2. The Envoy AI Gateway v1.0.x requires
  # EG >= v1.8.1 — at the older EG 1.4.3 the AI Gateway never wires model
  # routing (→ 404), so this floor is load-bearing for gateway-mode chat.
  TEST_INFRA_REPO_REF: 'v0.7.0'
  KUBECONFIG_PATH: '{{.ROOT_DIR}}/.test-infra/kubeconfig'
  NS: patch-playground
  EG_NS: envoy-gateway-system
  AIGW_NS: envoy-ai-gateway-system
  TOOL_DIR: '{{.ROOT_DIR}}/bin'
  CHAINSAW_VERSION: v0.2.15
  # patch CLI defaults for dev:chat / dev:card. The dev token + project come
  # from the overlay's `pg-demo-token:demo-user:demo-project`. Override on the
  # CLI, e.g. `task dev:chat PROJECT=other`.
  PATCH_URL: 'http://localhost:1986'
  PATCH_TOKEN: 'pg-demo-token'
  PROJECT: demo-project

includes:
  test-infra:
    taskfile: https://raw.githubusercontent.com/datum-cloud/test-infra/{{.TEST_INFRA_REPO_REF}}/Taskfile.yml
    vars:
      REPO_REF: '{{.TEST_INFRA_REPO_REF}}'

tasks:
  # ── Plain dev loop ──────────────────────────────────────────
  build:
    desc: Build the service and CLI binaries
    cmds:
      - go build ./...

  test:
    desc: Run unit tests (set TEST_DATABASE_URL to include Postgres store tests)
    cmds:
      - go vet ./...
      - go test -timeout 5m ./... -count=1

  install-tools:
    desc: Install version-pinned dev tools into ./bin
    cmds:
      - GOBIN={{.TOOL_DIR}} go install github.com/kyverno/chainsaw@{{.CHAINSAW_VERSION}}
    status:
      - test -x {{.TOOL_DIR}}/chainsaw

  # ── Cluster dev environment ─────────────────────────────────
  dev:setup:
    desc: Bring up the full dev environment (kind cluster + operators + stack).
      OVERLAY=dev|dev-catalog|dev-anthropic
    cmds:
      # On a cold VM every shared-operator image pulls at once, so the remote
      # cluster-up's per-wait timeout (default 300s) can lapse before the images
      # land — a false failure that a plain retry clears. Give the waits generous
      # headroom so the single `task dev:setup` command succeeds from zero.
      - task: test-infra:cluster-up
        vars:
          WAIT_TIMEOUT: '900s'
      - task: dev:build
      - task: dev:load
      - task: dev:deploy
        vars:
          OVERLAY: '{{.OVERLAY | default "dev"}}'

  dev:build:
    desc: Build the dev images (assistant compiled on the HOST — an in-image
      go build starves on a busy Docker VM; streamco/sink are thin node images)
    vars:
      GOARCH:
        sh: |
          case "$(uname -m)" in
            arm64|aarch64) echo arm64 ;;
            *) echo amd64 ;;
          esac
    cmds:
      - mkdir -p deploy/.build
      - CGO_ENABLED=0 GOOS=linux GOARCH={{.GOARCH}} go build -trimpath -ldflags="-s -w" -o deploy/.build/assistant ./cmd/assistant
      - CGO_ENABLED=0 GOOS=linux GOARCH={{.GOARCH}} go build -trimpath -ldflags="-s -w" -o deploy/.build/conversations-apiserver ./cmd/conversations-apiserver
      - docker build --provenance=false --sbom=false -t {{.IMAGE_ASSISTANT}}:{{.IMAGE_TAG}} -f deploy/assistant.Dockerfile deploy/.build
      - docker build --provenance=false --sbom=false -t {{.IMAGE_APISERVER}}:{{.IMAGE_TAG}} -f deploy/conversations-apiserver.Dockerfile deploy/.build
      - docker build --provenance=false --sbom=false -t {{.IMAGE_STREAMCO}}:{{.IMAGE_TAG}} -f deploy/streamco.Dockerfile e2e/streamco
      - docker build --provenance=false --sbom=false -t {{.IMAGE_SINK}}:{{.IMAGE_TAG}} -f deploy/sink.Dockerfile e2e/sink

  dev:load:
    desc: Load the dev images into the kind cluster
    cmds:
      - kind load docker-image {{.IMAGE_ASSISTANT}}:{{.IMAGE_TAG}} {{.IMAGE_APISERVER}}:{{.IMAGE_TAG}} {{.IMAGE_STREAMCO}}:{{.IMAGE_TAG}} {{.IMAGE_SINK}}:{{.IMAGE_TAG}} --name {{.TEST_INFRA_CLUSTER_NAME}}

  dev:deploy:
    desc: Deploy dependencies + the stack (staged, with waits). OVERLAY=dev|dev-catalog
    vars:
      OVERLAY: '{{.OVERLAY | default "dev"}}'
    env:
      KUBECONFIG: '{{.KUBECONFIG_PATH}}'
    cmds:
      # Stage 1: Envoy AI Gateway extension (additive shared infra), Flux-managed
      # like every other operator. Apply the OCIRepository sources + HelmReleases
      # (CRDs first, controller dependsOn them) and let Flux reconcile. This
      # replaces the old imperative `helm upgrade -i --wait` calls: Flux's
      # remediation.retries makes a cold-start image-pull blip self-heal instead
      # of leaving a stuck release (that failure previously left `aieg` failed
      # and permanently 404'd model routing). Idempotent: a healthy release is a
      # no-op reconcile, so this no longer churns a running controller.
      - kubectl apply -k config/dependencies/ai-gateway
      - kubectl -n flux-system wait helmrelease/ai-gateway-crds --for=condition=Ready --timeout=600s
      - kubectl -n flux-system wait helmrelease/ai-gateway --for=condition=Ready --timeout=600s
      - |
        if ! kubectl -n {{.EG_NS}} get cm envoy-gateway-config -o yaml 2>/dev/null | grep -q extensionManager; then
          kubectl -n flux-system patch helmrelease envoy-gateway --type merge \
            --patch-file config/dependencies/ai-gateway/eg-helmrelease-extension.patch.yaml
          kubectl -n flux-system annotate helmrelease envoy-gateway \
            "reconcile.fluxcd.io/requestedAt=$(date +%s)" --overwrite
          for i in $(seq 1 60); do
            kubectl -n {{.EG_NS}} get cm envoy-gateway-config -o yaml 2>/dev/null | grep -q extensionManager && break
            [ "$i" = 60 ] && { echo "timed out waiting for EG extension config" >&2; exit 1; }
            sleep 2
          done
          kubectl -n {{.EG_NS}} rollout restart deploy/envoy-gateway
          kubectl -n {{.EG_NS}} rollout status deploy/envoy-gateway --timeout=120s \
            || kubectl -n {{.EG_NS}} wait --for=condition=Available deploy/envoy-gateway --timeout=120s
        fi
      # Stage 2: CloudNativePG operator (server-side: the CRDs are too big for
      # client-side apply) + the conversation-store Cluster. The Cluster apply
      # retries through the operator webhook's readiness window.
      # The CNPG operator and postgres images are public upstream multi-arch
      # images; kubelet pulls them from ghcr directly. We deliberately do NOT
      # preload them via `kind load` — with docker's containerd image store
      # (colima), kind's `ctr images import --all-platforms` fails on a
      # multi-arch index ("content digest not found"), whereas a normal registry
      # pull selects the node platform correctly. (The operator Deployment is
      # imagePullPolicy:Always and the postgres image IfNotPresent, so both pull
      # on their own.) An air-gapped environment would mirror these to a local
      # registry instead.
      #
      # Ensure the target namespace FIRST: the conversation-store Cluster lives
      # in it, but the overlay that declares it is applied in Stage 3 — on a
      # fresh cluster the Cluster apply would otherwise fail "namespace not
      # found" (and the retry below can't fix a missing namespace).
      - kubectl create namespace {{.NS}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply --server-side --force-conflicts -f config/dependencies/cnpg/cnpg-operator-1.30.0.yaml
      - kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=300s
        || kubectl -n cnpg-system wait --for=condition=Available deploy/cnpg-controller-manager --timeout=300s
      # The Cluster CR is rejected until the operator's admission webhook is
      # actually serving — Deployment-Available is necessary but not sufficient
      # (the webhook Service endpoint populates a beat later, and on this shared
      # cluster the operator can restart under control-plane contention). Wait
      # for a webhook endpoint address first, then retry the apply generously
      # (up to ~8min) so a first-boot operator restart doesn't fail the deploy.
      - |
        for i in $(seq 1 60); do
          [ -n "$(kubectl -n cnpg-system get endpoints cnpg-webhook-service -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null)" ] && break
          sleep 5
        done
      - |
        for i in $(seq 1 48); do
          err=$(kubectl apply -k config/dependencies/cnpg 2>&1) && exit 0
          echo "cnpg apply attempt $i not yet admitted: $(echo "$err" | tail -1)" >&2
          sleep 10
        done
        echo "CNPG webhook never admitted the Cluster after ~8min" >&2; exit 1
      # Stage 3: the stack overlay. An *anthropic* overlay needs the
      # anthropic-api-key Secret (direct api.anthropic.com); materialize it from
      # key.txt (gitignored — never committed) before applying so the assistant
      # pod can start. Whitespace is stripped so a trailing newline can't corrupt
      # the key.
      - |
        case "{{.OVERLAY}}" in
          *anthropic*)
            test -f key.txt || { echo "OVERLAY={{.OVERLAY}} needs an Anthropic API key at ./key.txt" >&2; exit 1; }
            kubectl -n {{.NS}} create secret generic anthropic-api-key \
              --from-literal=key="$(tr -d '[:space:]' < key.txt)" \
              --dry-run=client -o yaml | kubectl apply -f - ;;
        esac
      - kubectl apply -k config/overlays/{{.OVERLAY}}
      # Stage 4: waits, dependency-first. CP-tolerant fallbacks — a flapping
      # controller-manager stalls `rollout status` on observedGeneration even
      # when pods are healthy.
      - kubectl -n {{.NS}} wait --for=condition=Ready cluster/conversation-store --timeout=600s
      - kubectl -n {{.NS}} rollout status deploy/stub-llm --timeout=180s
        || kubectl -n {{.NS}} wait --for=condition=Available deploy/stub-llm --timeout=60s
      - kubectl -n {{.NS}} rollout status deploy/streamco --timeout=180s
        || kubectl -n {{.NS}} wait --for=condition=Available deploy/streamco --timeout=60s
      - kubectl -n {{.NS}} rollout status deploy/sink --timeout=180s
        || kubectl -n {{.NS}} wait --for=condition=Available deploy/sink --timeout=60s
      - kubectl -n {{.NS}} wait --for=condition=Programmed gateway/patch-playground --timeout=300s
      - kubectl -n {{.NS}} rollout status deploy/assistant --timeout=300s
        || kubectl -n {{.NS}} wait --for=condition=Available deploy/assistant --timeout=120s
      # Conversations aggregated apiserver + its APIService registration. Wait
      # for the pod to roll out, then for the kube-aggregator to mark the
      # APIService Available (it probes the backing Service's /healthz).
      - kubectl -n {{.NS}} rollout status deploy/conversations-apiserver --timeout=300s
        || kubectl -n {{.NS}} wait --for=condition=Available deploy/conversations-apiserver --timeout=120s
      - kubectl wait --for=condition=Available apiservice/v1alpha1.assistant.miloapis.com --timeout=120s
      - 'echo "dev environment ready — chat with it:  task dev:chat   (one-shot: task dev:chat MSG=\"Diagnose pipeline p-1 for StreamCo\")"'

  dev:redeploy:
    desc: Fast loop — rebuild + reload the assistant image and roll the deployment
    env:
      KUBECONFIG: '{{.KUBECONFIG_PATH}}'
    cmds:
      - task: dev:build
      - task: dev:load
      - kubectl -n {{.NS}} rollout restart deploy/assistant
      - kubectl -n {{.NS}} rollout status deploy/assistant --timeout=300s
        || kubectl -n {{.NS}} wait --for=condition=Available deploy/assistant --timeout=120s

  dev:forward:
    desc: Port-forward the assistant (localhost:1986) and the AI gateway (localhost:1987); runs in the foreground
    env:
      KUBECONFIG: '{{.KUBECONFIG_PATH}}'
    cmds:
      - kubectl -n {{.NS}} port-forward svc/assistant 1986:7820 &
        kubectl -n {{.EG_NS}} port-forward svc/patch-ai-gateway 1987:80 &
        wait

  dev:chat:
    desc: >-
      Chat with the assistant. Opens the full-screen TUI by default; one-shot
      with a message: task dev:chat MSG="Diagnose pipeline p-1 for StreamCo";
      basic line REPL with PLAIN=1. Continue a thread with CTX=<context-id>.
      Auto-starts a port-forward if one isn't running.
    silent: true
    env:
      KUBECONFIG: '{{.KUBECONFIG_PATH}}'
      PATCH_URL: '{{.PATCH_URL}}'
      PATCH_TOKEN: '{{.PATCH_TOKEN}}'
    cmds:
      - |
        # Reuse a port-forward if one is already up (e.g. `task dev:forward` in
        # another terminal); otherwise forward svc/assistant for this invocation.
        if ! curl -sf -m 2 -o /dev/null "$PATCH_URL/healthz" 2>/dev/null; then
          echo "→ port-forwarding svc/assistant → localhost:1986 …"
          kubectl -n {{.NS}} port-forward svc/assistant 1986:7820 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf -m 2 -o /dev/null "$PATCH_URL/healthz" 2>/dev/null && break; sleep 0.5; done
        fi
        if [ -n "{{.MSG}}" ]; then
          go run ./cmd/patch chat "{{.MSG}}" --project {{.PROJECT}} {{if .CTX}}--context-id {{.CTX}}{{end}}
        elif [ -n "{{.PLAIN}}" ]; then
          go run ./cmd/patch chat -i --project {{.PROJECT}} {{if .CTX}}--context-id {{.CTX}}{{end}}
        else
          go run ./cmd/patch chat --tui --project {{.PROJECT}} {{if .CTX}}--context-id {{.CTX}}{{end}}
        fi

  dev:chats:
    desc: >-
      List this project's conversations from the aggregated apiserver, then
      resume one with `task dev:chat CTX=<context-id>`. Show one transcript with
      ID=<context-id>. Reads the cluster directly via kubectl (the apiserver
      read view) — no port-forward, uses KUBECONFIG not PATCH_URL/PATCH_TOKEN.
    silent: true
    env:
      KUBECONFIG: '{{.KUBECONFIG_PATH}}'
    cmds:
      - |
        if [ -n "{{.ID}}" ]; then
          go run ./cmd/patch conversations show {{.ID}} --project {{.PROJECT}}
        else
          go run ./cmd/patch conversations list --project {{.PROJECT}}
        fi

  dev:card:
    desc: Print the assistant's agent card (capability discovery). Auto-forwards.
    silent: true
    env:
      KUBECONFIG: '{{.KUBECONFIG_PATH}}'
      PATCH_URL: '{{.PATCH_URL}}'
      PATCH_TOKEN: '{{.PATCH_TOKEN}}'
    cmds:
      - |
        if ! curl -sf -m 2 -o /dev/null "$PATCH_URL/healthz" 2>/dev/null; then
          kubectl -n {{.NS}} port-forward svc/assistant 1986:7820 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf -m 2 -o /dev/null "$PATCH_URL/healthz" 2>/dev/null && break; sleep 0.5; done
        fi
        go run ./cmd/patch card --url "$PATCH_URL"

  dev:clean:
    desc: Remove this environment's namespace + GatewayClass (shared operators stay)
    env:
      KUBECONFIG: '{{.KUBECONFIG_PATH}}'
    cmds:
      - kubectl delete namespace {{.NS}} --ignore-not-found
      - kubectl delete gatewayclass patch-pg-gw --ignore-not-found

  # ── e2e ─────────────────────────────────────────────────────
  e2e:
    desc: Chainsaw environment tests (task e2e -- <path> for one suite)
    deps: [install-tools]
    env:
      KUBECONFIG: '{{.KUBECONFIG_PATH}}'
    cmds:
      - '{{.TOOL_DIR}}/chainsaw test --config test/e2e/.chainsaw.yaml {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}test/e2e/{{end}}'

  e2e:local:
    desc: Wire-level A2A/protocol e2e against locally-booted binaries (bun harness)
    cmds:
      - ./e2e/run-e2e.sh all
