# Publishes the two artifacts the platform deploys: the assistant container
# image and the kustomize bundle that references it.
#
# datum-cloud/infra's Flux OCIRepository pulls
# oci://ghcr.io/milo-os/assistant-kustomize. The reusable workflow's
# docker/metadata-action rules produce `v0.0.0-<branch>-<YYYYMMDD>-<HHmmss>` for
# a branch push, and infra's overlays filter on that branch segment. Staging
# currently filters `.*-integration-\d+-\d+`, not `-main-`: the service still
# lives in a stack of open PRs and `integration` is that stack's tip, so staging
# can exercise the real thing ahead of main. When the stack lands and the
# integration branch is retired, infra's staging patch flips back to
# `.*-main-\d+-\d+` — identical tag shape, only the branch segment differs.
#
# ONE image. It carries both binaries this module builds — the service and the
# aggregated apiserver — because they are released together and share the
# conversation-store schema and the assistant.miloapis.com types; separate
# images could drift into a version skew that nothing prevents. The apiserver
# Deployment selects its binary with `command`. sink and streamco serve the
# local playground and the e2e harness and are not published.
name: Build and Publish

on:
  # Only the branches something deploys from. A bare `push:` publishes an image
  # and a kustomize bundle on every push to every branch, and this repo carries
  # ~20 feature branches — ghcr fills with tags no OCIRepository ever pulls and
  # every WIP commit pays for a two-stage publish.
  #
  # `main` feeds production's OCIRepository, `integration` feeds staging's (see
  # the header); drop either one and that environment stops receiving builds.
  push:
    branches:
      - main
      - integration
  # Tags are deliberately not in the push filter. Cutting a release fires both
  # `push` (the tag) and `release: published`, so listing tags here would run
  # the whole publish twice for one release. The reusable workflows tag off
  # docker/metadata-action's `type=semver`, which reads refs/tags/* from
  # github.ref — set on a release event — so `release:` alone publishes v1.2.3.
  release:
    types: ["published"]

jobs:
  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.12.1

  publish-container-image:
    # No point building an image if the manifests that reference it are invalid.
    needs:
      - validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.14.0
    with:
      image-name: assistant
      # Repository root: the Dockerfile's default target compiles ./cmd/assistant
      # in-image, so it needs the source tree (the `prebuilt` target that copies
      # a host-compiled binary is for the local playground only).
      context: .
      dockerfile-path: deploy/assistant.Dockerfile
      registry-organization: milo-os
    secrets: inherit

  publish-kustomize-bundle:
    # The image must exist before the bundle that pins it is published —
    # publishing the bundle is what triggers the Flux rollout.
    needs:
      - validate-kustomize
      - publish-container-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.14.0
    with:
      bundle-name: ghcr.io/milo-os/assistant-kustomize
      # The whole config/ tree, so the bundle root carries both ./overlays/production
      # (the workload) and ./milo (the IAM projection) — the two paths infra's
      # Flux Kustomizations point at.
      bundle-path: config
      # Stamp the released tag into base; every overlay composes it, and the
      # apiserver Deployment runs the same image, so one pin covers both.
      image-overlays: config/base
      image-name: ghcr.io/milo-os/assistant
    secrets: inherit
