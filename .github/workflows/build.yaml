# One image carries both binaries — the service and the aggregated apiserver.
# They share the conversation-store schema and the assistant.miloapis.com types,
# so separate images could drift into a version skew nothing prevents.
name: Build and Publish

on:
  # Not a bare `push:` — this repo carries ~20 feature branches, and publishing
  # every one fills ghcr with tags no OCIRepository ever pulls.
  push:
    branches:
      - main
      - integration
  # PRs publish so a change has an image to deploy before it merges; note this
  # fires on every push to the head branch, not just when the PR opens.
  #
  # No Flux overlay can pull these: a PR tag carries the PR number rather than a
  # branch name, and the overlays filter on a literal branch segment.
  pull_request:
  # Tags are deliberately absent from the push filter: a release fires both
  # `push` (the tag) and `release: published`, so listing tags would publish
  # the same release twice.
  release:
    types: ["published"]

jobs:
  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.12.1

  publish-container-image:
    # No point building an image if the manifests that reference it are invalid.
    needs:
      - validate-kustomize
    # A fork PR gets a read-only GITHUB_TOKEN and no secrets, so the ghcr push
    # can only fail. publish-kustomize-bundle needs this job and skips alongside;
    # validate-kustomize needs neither and still runs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.14.0
    with:
      image-name: assistant
      # Repository root: the Dockerfile's default target compiles ./cmd/assistant
      # in-image, so it needs the source tree.
      context: .
      dockerfile-path: deploy/assistant.Dockerfile
      registry-organization: milo-os
    secrets: inherit

  publish-kustomize-bundle:
    # The image must exist before the bundle that pins it — publishing the bundle
    # is what triggers the Flux rollout.
    #
    # Published for PRs too: the bundle is what pins the image tag, so without one
    # a PR build can only be deployed by hand-editing the image, which infra's
    # README warns silently outranks a correctly pinned bundle.
    needs:
      - validate-kustomize
      - publish-container-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.14.0
    with:
      bundle-name: ghcr.io/milo-os/assistant-kustomize
      # The whole config/ tree, so the bundle root carries both
      # ./overlays/production and ./milo — the two paths infra's Flux
      # Kustomizations point at.
      bundle-path: config
      # Stamp the released tag into base; every overlay composes it, and the
      # apiserver Deployment runs the same image, so one pin covers both.
      image-overlays: config/base
      image-name: ghcr.io/milo-os/assistant
    secrets: inherit
