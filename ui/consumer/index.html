<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistant Portal Plugin — standalone preview</title>
  </head>
  <body>
    <!--
      Standalone dev harness. Humans can open http://localhost:7779/ to preview
      the chat dock in isolation. The PORTAL never loads this page — it only
      fetches /plugin-manifest.json and /remoteEntry.js. This harness exists
      purely so the widget can be eyeballed without the full portal (data
      calls hit the apiserver directly via fetchImpl — point it at a local
      `cmd/assistant-apiserver` to see live data; otherwise you'll see error
      states, which is expected).
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
