# The playground namespace. Every resource this playground creates — here and
# in the cluster-scoped GatewayClass — carries
# app.kubernetes.io/part-of=agent-framework-playground, which is the exact set
# playground-down.sh removes (proof P8).
apiVersion: v1
kind: Namespace
metadata:
  name: patch-playground
  labels:
    app.kubernetes.io/part-of: agent-framework-playground
