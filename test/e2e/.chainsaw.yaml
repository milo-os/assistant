# Chainsaw configuration for the environment e2e suite (house pattern:
# milo-os/billing test/e2e/.chainsaw.yaml). Runs against the dev environment
# stood up by `task dev:setup`; invoke via `task e2e`.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Configuration
metadata:
  name: assistant-e2e
spec:
  parallel: 1
  timeouts:
    apply: 60s
    assert: 300s
    cleanup: 120s
    exec: 300s
