# Environment health: every component of the dev environment is up — the
# assistant, its model/tool data plane, the usage sink, and the durable
# conversation store. Pure asserts against live state; no mutations.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: env-health
spec:
  # The environment is persistent — never delete anything from it.
  skipDelete: true
  steps:
    - name: workloads-available
      try:
        - assert:
            file: assert-workloads.yaml
    - name: gateway-programmed
      try:
        - assert:
            file: assert-gateway.yaml
    - name: conversation-store-ready
      try:
        - assert:
            file: assert-cnpg.yaml
