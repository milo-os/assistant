# TLS ingress for the assistant's A2A surface. The service speaks plaintext
# HTTP internally; TLS is terminated here at a Gateway-API Gateway (the Milo
# platform posture). cert-manager issues the cert from a ClusterIssuer.
#
# Consumers reach https://<PUBLIC_BASE_URL>/a2a and /.well-known/agent-card.json.
# If your platform fronts services with a shared Gateway, drop this Gateway and
# attach the HTTPRoute to that Gateway instead.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: assistant-tls
spec:
  secretName: assistant-tls
  dnsNames:
    - REPLACE_WITH_PUBLIC_HOSTNAME
  issuerRef:
    kind: ClusterIssuer
    name: REPLACE_WITH_CLUSTER_ISSUER
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: assistant
spec:
  gatewayClassName: REPLACE_WITH_GATEWAY_CLASS
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: REPLACE_WITH_PUBLIC_HOSTNAME
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: assistant-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: assistant
spec:
  parentRefs:
    - name: assistant
  hostnames:
    - REPLACE_WITH_PUBLIC_HOSTNAME
  rules:
    - matches:
        - path: { type: PathPrefix, value: /a2a }
        - path: { type: PathPrefix, value: /.well-known }
      backendRefs:
        - name: assistant
          port: 7820
