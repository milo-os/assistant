# Horizontal autoscaling for the assistant. Conversations are I/O-bound
# (model + MCP round-trips), so CPU is a loose proxy; tune to real load. Min 3
# keeps availability across a node loss + a rolling update.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: assistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: assistant
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
