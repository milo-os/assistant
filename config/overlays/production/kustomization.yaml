# Production overlay for the Patch assistant service.
#
# Self-contained on config/base (the assistant Deployment/Service + namespace);
# it does NOT include the dev components (gateway/stub-llm/streamco/sink) — in
# production the AI gateway, the capability provider (service catalog), and the
# usage collector are platform infrastructure, not deployed here. The overlay
# FULLY REPLACES base's dev env (a JSON6902 replace, not a merge) so no dev
# token or dev value can leak into a production deploy.
#
# It is intentionally not directly-appliable as-is: it references Secrets and a
# hostname the operator supplies (see README.md). Render + review with
#   kubectl kustomize config/overlays/production
# and apply the reviewed output through your GitOps/CD pipeline.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production namespace (base's namespace.yaml is renamed by this transformer).
namespace: patch-system

resources:
  - ../../base
  - cnpg-cluster.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - gateway-tls.yaml
  - alerts.yaml

# Metadata labels only (not selectors — the base already labels pods
# {app: assistant}, and mutating an existing selector is an error).
labels:
  - pairs:
      app.kubernetes.io/name: patch-assistant
      app.kubernetes.io/part-of: patch
    includeSelectors: false

# NO `images:` block here on purpose. The release pin lives in config/base
# (`REPLACE_WITH_RELEASE_TAG`), which .github/workflows/build.yaml rewrites with
# `kustomize edit set image` before pushing the kustomize bundle; this overlay
# inherits it. An images entry here would run AFTER base's and overwrite the
# released tag — which is how you ship the wrong version. Pin in base, or not
# at all.

patches:
  # Structural hardening: replicas, securityContext, probes (readiness gates on
  # dependencies via /readyz), resources.
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: assistant
  # Full env replacement — nothing from base's dev env survives.
  - target:
      kind: Deployment
      name: assistant
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: PORT
            value: "7820"
          - name: HOST
            value: "0.0.0.0"
          - name: LOG_LEVEL
            value: "info"
          # ── Public identity (agent-card url + CloudEvents source) ──
          - name: PUBLIC_BASE_URL
            value: "https://REPLACE_WITH_PUBLIC_HOSTNAME"
          # ── Model: gateway mode, keyless (upstream key lives at the gateway) ──
          - name: MODEL_MODE
            value: "gateway"
          - name: GATEWAY_URL
            value: "http://REPLACE_WITH_AI_GATEWAY_HOST/v1"
          - name: GATEWAY_MODEL
            value: "REPLACE_WITH_PRODUCTION_MODEL"
          # ── AuthN: TokenReview against the Milo control plane, not dev ──
          # Auth needs no configuration here. Identity (TokenReview) and
          # project access (SubjectAccessReview) are both resolved against the
          # control plane using the pod's own service-account token and the
          # in-cluster endpoint derived from KUBERNETES_SERVICE_HOST/PORT.
          # Set AUTHN_TOKENREVIEW_* / AUTHZ_SAR_* only to point at an external
          # control plane.
          # ── Durable conversation + task store (CloudNativePG) ──
          - name: CONVERSATION_STORE_URL
            valueFrom:
              secretKeyRef: { name: conversation-store-app, key: uri }
          # In-cluster capability endpoints (AI gateway, catalog provider)
          # resolve to private ClusterIPs; permit private addressing (link-local
          # / cloud-metadata stay blocked regardless). For an UNTRUSTED
          # third-party-provider posture, drop this and wire the host allow-list
          # (see README — the guard supports it; config wiring is the follow-up).
          - name: CAPABILITY_ALLOW_PRIVATE_NETWORKS
            value: "true"
          # ── Capabilities: the service catalog's provider API (NOT a fixture) ──
          - name: CAPABILITY_PROVIDER_URL
            value: "http://REPLACE_WITH_CAPABILITY_PROVIDER_HOST"
          # ── Usage metering collector ──
          - name: USAGE_GATEWAY_URL
            valueFrom:
              secretKeyRef: { name: assistant-usage-collector, key: url }
          - name: USAGE_GATEWAY_API_KEY
            valueFrom:
              secretKeyRef: { name: assistant-usage-collector, key: apiKey }
          # ── Persona (optional) ──
          # Unset ⇒ agent.DefaultPersona (the built-in Datum voice). A platform
          # provider wanting their own identity/voice sets PERSONA_PROMPT_FILE to
          # a mounted file — the fixed tool-use/provenance rules in
          # internal/agent.BuildSystemPrompt always still apply, so this can only
          # change branding, never the safety-relevant instructions. Mirrors the
          # capability-documents ConfigMap mount in config/overlays/dev:
          #
          #   - name: PERSONA_PROMPT_FILE
          #     value: /config/persona/persona.md
          #
          # ...plus a volumeMount (name: persona, mountPath: /config/persona,
          # readOnly: true) and a matching `volumes:` entry sourced from a
          # configMapGenerator (key: persona.md) in this overlay.
