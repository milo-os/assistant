# Production overlay for the Patch assistant service.
#
# Self-contained on config/base (the assistant Deployment/Service + namespace);
# it does NOT include the dev components (gateway/stub-llm/streamco/sink) — in
# production the AI gateway, the capability provider (service catalog), and the
# usage collector are platform infrastructure, not deployed here. The overlay
# FULLY REPLACES base's dev env (a JSON6902 replace, not a merge) so no dev
# token or dev value can leak into a production deploy.
#
# It is intentionally not directly-appliable as-is: it references Secrets and a
# hostname the operator supplies (see README.md). Render + review with
#   kubectl kustomize config/overlays/production
# and apply the reviewed output through your GitOps/CD pipeline.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production namespace (base's namespace.yaml is renamed by this transformer).
namespace: patch-system

resources:
  - ../../base
  - cnpg-cluster.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - gateway-tls.yaml
  - alerts.yaml

# Metadata labels only (not selectors — the base already labels pods
# {app: assistant}, and mutating an existing selector is an error).
labels:
  - pairs:
      app.kubernetes.io/name: patch-assistant
      app.kubernetes.io/part-of: patch
    includeSelectors: false

# NO `images:` block here on purpose. The release pin lives in config/base
# (`REPLACE_WITH_RELEASE_TAG`), which .github/workflows/build.yaml rewrites with
# `kustomize edit set image` before pushing the kustomize bundle; this overlay
# inherits it. An images entry here would run AFTER base's and overwrite the
# released tag — which is how you ship the wrong version. Pin in base, or not
# at all.

patches:
  # Structural hardening: replicas, securityContext, probes (readiness gates on
  # dependencies via /readyz), resources.
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: assistant
  # Full env replacement — nothing from base's dev env survives.
  - target:
      kind: Deployment
      name: assistant
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: PORT
            value: "7820"
          - name: HOST
            value: "0.0.0.0"
          - name: LOG_LEVEL
            value: "info"
          # ── Public identity (agent-card url + CloudEvents source) ──
          - name: PUBLIC_BASE_URL
            value: "https://REPLACE_WITH_PUBLIC_HOSTNAME"
          # ── Model: gateway mode, keyless (upstream key lives at the gateway) ──
          - name: MODEL_MODE
            value: "gateway"
          - name: GATEWAY_URL
            value: "http://REPLACE_WITH_AI_GATEWAY_HOST/v1"
          - name: GATEWAY_MODEL
            value: "REPLACE_WITH_PRODUCTION_MODEL"
          # ── AuthN: TokenReview against the Milo control plane, not dev ──
          # Auth needs no configuration here. Identity (TokenReview) and
          # project access (SubjectAccessReview) are both resolved against the
          # control plane using the pod's own service-account token and the
          # in-cluster endpoint derived from KUBERNETES_SERVICE_HOST/PORT.
          # Set AUTHN_TOKENREVIEW_* / AUTHZ_SAR_* only to point at an external
          # control plane.
          # ── Durable conversation + task store (CloudNativePG) ──
          - name: CONVERSATION_STORE_URL
            valueFrom:
              secretKeyRef: { name: conversation-store-app, key: uri }
          # In-cluster capability endpoints (AI gateway, catalog provider)
          # resolve to private ClusterIPs; permit private addressing (link-local
          # / cloud-metadata stay blocked regardless). For an UNTRUSTED
          # third-party-provider posture, drop this and wire the host allow-list
          # (see README — the guard supports it; config wiring is the follow-up).
          - name: CAPABILITY_ALLOW_PRIVATE_NETWORKS
            value: "true"
          # Hosts sanctioned to receive the CALLING USER's bearer token and the
          # turn's project. Unset ⇒ forwarded to nobody. Set it to the AI gateway
          # fronting the provider endpoints; never widen it to a host a
          # capability document merely names.
          - name: CAPABILITY_IDENTITY_FORWARD_HOSTS
            value: "REPLACE_WITH_AI_GATEWAY_HOST"
          # Hosts an MCP endpoint may be DIALED at, at all. Same comma-separated
          # shape as the list above and, in practice, the same value — but a
          # different question: that one is "may receive the user's credential",
          # this one "may be dialed". They stay separate so widening one cannot
          # silently widen the other; a credential-forwarding list should never
          # grow an entry nobody reviewed.
          #
          # Every provider tool call is supposed to traverse the AI gateway.
          # Leave this unset and the check is DISABLED, and three things break
          # at once for any binding that names a provider's raw address:
          #   1. The gateway's copy of the reviewed tool allow-list stops being
          #      consulted. config/components/streamco/mcp-route.yaml is the
          #      model: the MCPRoute is the enforcement point a compromised or
          #      misconfigured assistant cannot bypass, and tools deliberately
          #      left off it stay reachable on a direct connection.
          #   2. Metering breaks. Provider tool invocations reach billing by
          #      passing through the gateway; a direct connection is unbilled.
          #   3. Caller-identity forwarding silently stops, because the raw host
          #      is not in CAPABILITY_IDENTITY_FORWARD_HOSTS — so every
          #      read-as-the-caller tool starts failing in a way that reads like
          #      a provider bug rather than a projection bug.
          #
          # This matters MORE under CAPABILITY_SOURCE=crd than under http. With
          # the HTTP adapter, the component that rewrote a raw endpoint to the
          # gateway's MCPRoute URL and the component that served it were one
          # process: the two could not drift. Under crd the rewrite happens in
          # the catalog's projection controller and the dial happens here, hours
          # later, from an object in between — so a controller regression can
          # publish an un-rewritten endpoint that this service would otherwise
          # faithfully dial. Set it now, before the flip, so the enforcement is
          # already in place when the producer changes.
          #
          # An endpoint outside the list is skipped like any unreachable server,
          # and the binding gets Accepted=False naming the unsanctioned host.
          - name: CAPABILITY_MCP_ENDPOINT_HOSTS
            value: "REPLACE_WITH_AI_GATEWAY_HOST"
          # ── Capabilities: the service catalog's provider API (NOT a fixture) ──
          # The mode is stated, not inferred from the companion variable below.
          # Production must not depend on the deprecation shim: when that shim
          # is dropped, an overlay that relied on it starts up with NO
          # capability source and every turn quietly degrades to built-ins.
          - name: CAPABILITY_SOURCE
            value: http
          - name: CAPABILITY_PROVIDER_URL
            value: "http://REPLACE_WITH_CAPABILITY_PROVIDER_HOST"
          #
          # ── The crd cutover, pre-staged ───────────────────────────────────
          # Replace the two entries above with the one below to move this
          # deployment onto CapabilityBinding objects read from each project's
          # control plane. The flip is one env edit in each direction; the
          # rollback is putting these two lines back (see
          # docs/runbooks/capability-source-degraded.md, "Cutover and
          # rollback", which is the procedure — this block is only the diff).
          #
          #   - name: CAPABILITY_SOURCE
          #     value: crd
          #
          # crd takes NO companion variable. The control-plane URL, CA bundle
          # and client certificate it needs are the ones the SAR authorizer is
          # already configured with; a second way to name the same control
          # plane is a second way to point half the service at the wrong one.
          # Config validation rejects a companion variable left set for a mode
          # that does not use it, so CAPABILITY_PROVIDER_URL must come out in
          # the same edit — a half-finished overlay fails at boot rather than
          # booting with a source nobody intended.
          #
          # NOT FLIPPED YET, and the two gates are not this repository's to
          # close:
          #   1. The catalog's projection controller is unpushed, so nothing is
          #      writing CapabilityBinding objects. Flipping today would give
          #      every project an empty LIST — which is indistinguishable from
          #      "entitled to nothing" — and compose zero capabilities for all
          #      of them.
          #   2. The assistant's root-RBAC grant for capabilitybindings has not
          #      been observed resolving against a real Milo project path. One
          #      LIST, 200 vs 403, settles it; until it has been run the grant
          #      is well-evidenced but unverified.
          # ── Usage metering collector ──
          - name: USAGE_GATEWAY_URL
            valueFrom:
              secretKeyRef: { name: assistant-usage-collector, key: url }
          - name: USAGE_GATEWAY_API_KEY
            valueFrom:
              secretKeyRef: { name: assistant-usage-collector, key: apiKey }
          # ── Persona (optional) ──
          # Unset ⇒ agent.DefaultPersona (the built-in Datum voice). A platform
          # provider wanting their own identity/voice sets PERSONA_PROMPT_FILE to
          # a mounted file — the fixed tool-use/provenance rules in
          # internal/agent.BuildSystemPrompt always still apply, so this can only
          # change branding, never the safety-relevant instructions. Mirrors the
          # capability-documents ConfigMap mount in config/overlays/dev:
          #
          #   - name: PERSONA_PROMPT_FILE
          #     value: /config/persona/persona.md
          #
          # ...plus a volumeMount (name: persona, mountPath: /config/persona,
          # readOnly: true) and a matching `volumes:` entry sourced from a
          # configMapGenerator (key: persona.md) in this overlay.
