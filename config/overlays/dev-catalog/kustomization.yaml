# Dev overlay — CATALOG capability mode: capabilities come from the service
# catalog's capability-provider API (AgentBinding projection) instead of the
# fixture file. Requires the catalog side to be running (see
# milo-os/service-catalog hack/playground). Apply with
# `task dev:deploy OVERLAY=dev-catalog`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../components/gateway
  - ../../components/llm-stub
  - ../../components/streamco
  - ../../components/sink

images:
  - name: ghcr.io/milo-os/assistant
    newTag: dev
  - name: ghcr.io/milo-os/assistant-streamco
    newTag: dev
  - name: ghcr.io/milo-os/assistant-sink
    newTag: dev

secretGenerator:
  - name: assistant-dev-token
    namespace: patch-playground
    literals:
      - tokens=pg-demo-token:demo-user:demo-project
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/part-of: agent-framework-playground

patches:
  - target:
      kind: Deployment
      name: assistant
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: assistant
        namespace: patch-playground
      spec:
        template:
          spec:
            containers:
              - name: assistant
                env:
                  - name: CAPABILITY_PROVIDER_URL
                    value: http://capability-provider.agent-framework-playground.svc.cluster.local:8080
