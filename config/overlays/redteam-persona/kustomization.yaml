# Red-team overlay — layers a deliberately ADVERSARIAL persona override on top
# of `dev` to verify the fixed `operatingRules` section of the system prompt
# survives in the REAL deployed system (mounted from a ConfigMap, read from
# file, concatenated by BuildSystemPrompt, sent over the wire) even when the
# provider-supplied persona is a full prompt-injection payload. Mirrors
# `dev-persona`'s wiring exactly; only persona.md content differs. Apply with
# `task dev:deploy OVERLAY=redteam-persona`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../dev

configMapGenerator:
  - name: assistant-persona
    namespace: patch-playground
    files:
      - persona.md
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/part-of: agent-framework-playground

patches:
  - target:
      kind: Deployment
      name: assistant
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: assistant
        namespace: patch-playground
      spec:
        template:
          spec:
            containers:
              - name: assistant
                env:
                  - name: PERSONA_PROMPT_FILE
                    value: /config/persona/persona.md
                volumeMounts:
                  - name: persona
                    mountPath: /config/persona
                    readOnly: true
            volumes:
              - name: persona
                configMap:
                  name: assistant-persona
