apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - assistant.yaml
  - rbac.yaml
  # The aggregated apiserver. Part of base rather than an overlay opt-in: it
  # serves assistant.miloapis.com (conversations, capabilitygapreports,
  # assistantendpoints), so a deployment without it has no read view of its own
  # data and no way to advertise its address. The APIService that registers it
  # with an aggregator stays a separate component — that registration is
  # environment-specific and, on the Datum platform, is installed into Milo
  # rather than alongside the workload.
  - assistant-apiserver

# The service image, and the single place its release tag is pinned (the
# apiserver image is pinned in assistant-apiserver/kustomization.yaml). .github/workflows/build.yaml runs
#   kustomize edit set image ghcr.io/milo-os/assistant=...:<build tag>
# against THIS directory before pushing the kustomize bundle, so every overlay
# that composes base inherits the released tag.
#
# The placeholder is deliberate: a bundle that somehow shipped unstamped fails
# loudly on ImagePullBackOff instead of silently pulling :latest. No overlay may
# re-pin this image — an overlay's images transformer runs after base's and
# would overwrite the released tag (see overlays/production).
images:
  - name: ghcr.io/milo-os/assistant
    newTag: REPLACE_WITH_RELEASE_TAG
