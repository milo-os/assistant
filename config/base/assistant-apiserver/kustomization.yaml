apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` transformer: every resource hardcodes its namespace, because
# the auth-reader RoleBinding must stay in kube-system while everything else is
# in patch-playground. A transformer would clobber the RoleBinding's namespace
# (it runs after patches, so a patch can't reliably pin it back).
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - rbac-auth-reader.yaml
  - rbac-cluster.yaml

# Where the apiserver image's release tag is pinned. build.yaml runs
#   kustomize edit set image ghcr.io/milo-os/assistant-apiserver=...:<build tag>
# against THIS directory. `latest` was fine while nothing published this image;
# now that CI does, use the same loud placeholder as config/base so an unstamped
# bundle fails on ImagePullBackOff instead of silently pulling whatever :latest
# happens to be.

# No `images:` here — the Deployment runs the image pinned in ../kustomization.yaml,
# whose transformer covers every resource base composes, this directory included.
