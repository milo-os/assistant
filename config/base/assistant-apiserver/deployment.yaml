# The assistant aggregated API server: a read-only KRM view
# (assistant.miloapis.com/v1alpha1 Conversations + messages subresource) over
# the shared conversations/messages Postgres tables the A2A assistant writes on
# the chat hot path. It reuses the SAME CloudNativePG store as the assistant —
# the `conversation-store-app` secret's `uri` key — so it lives in
# patch-playground alongside the store and the assistant Deployment.
#
# TLS: the serving keypair is named by SERVING_TLS_CERT_FILE /
# SERVING_TLS_PRIVATE_KEY_FILE, which the args below expand into
# --tls-cert-file / --tls-private-key-file. Both are empty here, which the
# apiserver's serving options read as unset, so the server self-signs on boot
# into --cert-dir=/tmp. That is safe in dev because the overlay marks the
# APIService insecureSkipTLSVerify=true — the kube-aggregator does not verify
# the serving cert. An environment fronting this with a verifying APIService
# mounts a real keypair and points those two variables at it; see the note on
# the env block.
#
# Delegated authn/authz: all three kubeconfig variables below are empty, so the
# server falls back to its in-cluster client for TokenReview and
# SubjectAccessReview — i.e. the kind cluster's own apiserver/RBAC (design
# decision #3). The requestheader client CA is then discovered from that
# cluster's kube-system `extension-apiserver-authentication` configmap (which
# the auth-reader RoleBinding + cluster RBAC grant read access to), so no CA
# volume is mounted.
#
# That fallback is a DEV-ONLY convenience. Behind a Milo control plane the
# aggregator is milo-apiserver, and the callers it proxies are Milo identities
# that the workload cluster has never heard of — so reviews sent to the local
# apiserver fail and the APIService goes Stale. Such a deployment points all
# three at a kubeconfig for milo-apiserver instead (see datum-cloud/infra
# apps/patch-assistant), which is why they are variables and not literals. The
# names match the ipam and activity apiserver bundles so one infra pattern
# covers all three.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-apiserver
  namespace: patch-playground
  labels:
    app: assistant-apiserver
    app.kubernetes.io/part-of: agent-framework-playground
spec:
  replicas: 1
  selector:
    matchLabels: { app: assistant-apiserver }
  template:
    metadata:
      labels:
        app: assistant-apiserver
        app.kubernetes.io/part-of: agent-framework-playground
    spec:
      serviceAccountName: assistant-apiserver
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apiserver
          # The one image this repo publishes: it carries both binaries, and
          # the `command` below selects this one.
          image: ghcr.io/milo-os/assistant
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          command:
            - /usr/local/bin/assistant-apiserver
            - serve
          args:
            - --secure-port=8443
            # Self-signed serving cert lands here (root fs is read-only).
            - --cert-dir=/tmp
            # $(VAR) is expanded by the kubelet from this container's own env.
            # Deployments that need a real serving certificate override the two
            # variables rather than this list, so the flag surface stays owned
            # by this file.
            - --tls-cert-file=$(SERVING_TLS_CERT_FILE)
            - --tls-private-key-file=$(SERVING_TLS_PRIVATE_KEY_FILE)
            # Where TokenReview, SubjectAccessReview and the core-API client
            # are sent. All three are needed: leaving --kubeconfig behind while
            # moving the other two still drags the generic apiserver's own
            # client back to the in-cluster fallback.
            - --authentication-kubeconfig=$(AUTHENTICATION_KUBECONFIG)
            - --authorization-kubeconfig=$(AUTHORIZATION_KUBECONFIG)
            - --kubeconfig=$(KUBECONFIG)
            - --authentication-skip-lookup=$(AUTHENTICATION_SKIP_LOOKUP)
            - --authentication-tolerate-lookup-failure=$(AUTHENTICATION_TOLERATE_LOOKUP_FAILURE)
            - --requestheader-client-ca-file=$(REQUESTHEADER_CLIENT_CA_FILE)
            - --authorization-always-allow-paths=$(AUTHORIZATION_ALWAYS_ALLOW_PATHS)
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          env:
            # Serving keypair, expanded into --tls-cert-file /
            # --tls-private-key-file above. Empty means "self-sign into
            # --cert-dir", which is what dev wants.
            #
            # These are env rather than args so that an environment can point
            # them at a mounted keypair with a strategic-merge patch — `env`
            # merges by name, so it replaces these two entries and leaves the
            # rest of the container alone. Patching `args` instead would mean
            # restating the whole list, and every flag in it would silently
            # freeze at whatever this file said on the day the patch was
            # written.
            - name: SERVING_TLS_CERT_FILE
              value: ""
            - name: SERVING_TLS_PRIVATE_KEY_FILE
              value: ""
            # Delegated authn/authz. Empty means "use the in-cluster client",
            # which is the dev fallback described in the header; a Milo
            # deployment points all three at a kubeconfig for milo-apiserver.
            - name: AUTHENTICATION_KUBECONFIG
              value: ""
            - name: AUTHORIZATION_KUBECONFIG
              value: ""
            - name: KUBECONFIG
              value: ""
            # Booleans, so these carry a real default rather than an empty one:
            # `--flag=` fails to parse as a bool and the process would not start.
            - name: AUTHENTICATION_SKIP_LOOKUP
              value: "false"
            - name: AUTHENTICATION_TOLERATE_LOOKUP_FAILURE
              value: "false"
            # Empty means "discover it from the extension-apiserver-authentication
            # configmap on whichever cluster the kubeconfigs above point at".
            - name: REQUESTHEADER_CLIENT_CA_FILE
              value: ""
            # Unauthenticated paths. A variable so a deployment can add
            # /metrics for a scrape that cannot present credentials.
            - name: AUTHORIZATION_ALWAYS_ALLOW_PATHS
              value: "/healthz,/readyz,/livez"
            # Same durable store as the assistant: the CNPG-generated
            # `conversation-store-app` secret's `uri` points at the cluster's
            # -rw service. The apiserver reads (list/get/messages) the tables
            # the assistant writes; it fails fast if the store is unreachable.
            - name: CONVERSATION_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: conversation-store-app
                  key: uri
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
