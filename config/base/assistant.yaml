# The in-cluster assistant. Gateway mode: MODEL_MODE=gateway with NO model
# credential in env — the upstream key lives only at the gateway
# (components/llm-stub). AUTH_MODE=dev with the token from the
# `assistant-dev-token` Secret (generated by the overlay). The capability
# SOURCE (fixture vs provider API) is deliberately absent here — each overlay
# adds exactly one, so a mode switch is a clean declarative swap and the
# mutually-exclusive pair can never both be set.
#
# GATEWAY_URL is static because components/gateway pins the managed Envoy
# Service name (EnvoyProxy spec.provider.kubernetes.envoyService.name) — no
# discovery or templating step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
  namespace: patch-playground
  labels:
    app: assistant
    app.kubernetes.io/part-of: agent-framework-playground
spec:
  replicas: 1
  selector:
    matchLabels: { app: assistant }
  template:
    metadata:
      labels:
        app: assistant
        app.kubernetes.io/part-of: agent-framework-playground
    spec:
      containers:
        - name: assistant
          image: ghcr.io/milo-os/assistant
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7820
          env:
            - name: PORT
              value: "7820"
            - name: HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: "info"
            # ── Model: gateway mode, keyless ────────────────────────
            - name: MODEL_MODE
              value: "gateway"
            # NOTE the /v1: the OpenAI-compatible client appends
            # /chat/completions to this base, and the AI gateway routes
            # /v1/chat/completions. Without /v1 every request 404s.
            - name: GATEWAY_URL
              value: "http://patch-ai-gateway.envoy-gateway-system.svc.cluster.local:80/v1"
            - name: GATEWAY_MODEL
              value: "patch-stub-v1"
            # ── Conversation store: durable history (CloudNativePG) ─
            # `conversation-store-app` is generated by the CNPG operator for
            # the Cluster in dependencies/cnpg; its `uri` key points at the
            # cluster's -rw service. The assistant fails fast if the database
            # is unreachable — kubelet restarts bridge the postgres boot window.
            - name: CONVERSATION_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: conversation-store-app
                  key: uri
            # ── Auth: dev token from a Secret ───────────────────────
            - name: AUTH_MODE
              value: "dev"
            - name: AUTH_DEV_TOKENS
              valueFrom:
                secretKeyRef:
                  name: assistant-dev-token
                  key: tokens
            # ── Usage: emit CloudEvents to the in-cluster sink ──────
            - name: USAGE_GATEWAY_URL
              value: "http://sink.patch-playground.svc.cluster.local:7811"
            # Agent card / CloudEvents source advertises the host-reachable
            # URL (`task dev:forward` port-forwards to this localhost port).
            - name: PUBLIC_BASE_URL
              value: "http://localhost:1986"
          readinessProbe:
            httpGet: { path: /healthz, port: 7820 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 7820 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: assistant
  namespace: patch-playground
  labels:
    app: assistant
    app.kubernetes.io/part-of: agent-framework-playground
spec:
  selector: { app: assistant }
  ports:
    - name: http
      port: 7820
      targetPort: 7820
  type: ClusterIP
