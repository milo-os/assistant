# The role a capability PROVIDER's automation is bound to — in the platform,
# the service catalog's own identity, which materializes one CapabilityBinding
# per (project, entitled service) and revises it when a provider publishes a new
# reviewed configuration.
#
# This is a high-trust grant and it is meant to be bound narrowly. A binding's
# spec names MCP endpoints the assistant will connect to and skill bodies the
# model will follow, so whoever holds this in a project decides what that
# project's assistant can reach. It is not a role for a human project member;
# the read-only capability-viewer below is.
#
# The publisher manages binding specifications and receives no /status
# permissions. With Milo subresource authorization enabled, only an explicit
# capabilitybindings/status.update or .patch grant can change the assistant's
# Accepted and Composed conditions. Leaving patch out of the base permissions
# alone is not a status boundary: legacy authorization also accepts base update
# for PUT /status. Enforcement remains off by default until the platform enables
# the provider feature.
#
# The assistant's own status writeback uses the existing Kubernetes RBAC grant
# in ../../rbac/control-plane-auth-delegator.yaml: get/list on bindings and patch
# on capabilitybindings/status. This Role does not authorize that identity.
apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: capabilities.assistant.miloapis.com-capability-publisher
  namespace: milo-system
  labels:
    app.kubernetes.io/name: capability-publisher
    app.kubernetes.io/part-of: assistant.miloapis.com
spec:
  launchStage: Beta
  includedPermissions:
    - capabilities.assistant.miloapis.com/capabilitybindings.create
    - capabilities.assistant.miloapis.com/capabilitybindings.update
    - capabilities.assistant.miloapis.com/capabilitybindings.delete
    - capabilities.assistant.miloapis.com/capabilitybindings.get
    - capabilities.assistant.miloapis.com/capabilitybindings.list
    - capabilities.assistant.miloapis.com/capabilitybindings.watch
