# CapabilityGapReport — read-only diagnostics served by the conversations
# aggregated apiserver (internal/apiserver/registry/capabilitygapreport
# implements rest.Lister only, so `list` is the whole surface).
apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: assistant.miloapis.com-capabilitygapreports
spec:
  serviceRef:
    name: "assistant.miloapis.com"
  kind: CapabilityGapReport
  plural: capabilitygapreports
  singular: capabilitygapreport
  permissions:
    - list
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Organization
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
