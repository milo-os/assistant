# The assistant's projection INTO the Milo control plane.
#
# This is not deployed alongside the service — it is applied to Milo itself, by
# a separate Flux Kustomization in datum-cloud/infra that points at `./milo/`
# inside this repo's published kustomize bundle and targets the milo-system
# namespace.
#
# Why it is load-bearing: with AUTHZ_MODE=sar the assistant asks Milo whether
# the caller may `create` conversations.assistant.miloapis.com in the project's
# namespace, and the check FAILS CLOSED. Until the ProtectedResource in iam/
# registers that permission with Milo's IAM, nothing can grant it and every
# request 403s.
#
# ─── WHAT INFRA MUST ADD, 2026-09 ────────────────────────────────────────────
#
# This header used to cite datum-cloud/infra
# apps/patch-assistant/base/milo-service-configuration.yaml as the thing that
# applies this directory. THAT APP DOES NOT EXIST IN THE INFRA REPOSITORY —
# `apps/` has no patch-assistant entry at all, and nothing under apps/ names the
# assistant. Treat the delivery path as UNBUILT, not as working: if it has never
# existed, the ProtectedResources and the control-plane RBAC in this directory
# are not reaching Milo today, and the SAR path works in production only to the
# extent it is not yet exercised. Confirm this before assuming any manifest here
# is live.
#
# What has to be created, and the closest working template to copy:
# infra/apps/billing-system/base/milo-control-plane.yaml. A Flux Kustomization
# that applies to MILO rather than to the workload cluster is distinguished by
# one field — it carries a kubeConfig for the Milo control plane:
#
#   apiVersion: kustomize.toolkit.fluxcd.io/v1
#   kind: Kustomization
#   metadata:
#     name: assistant-milo-control-plane
#   spec:
#     targetNamespace: milo-system
#     sourceRef:
#       kind: OCIRepository
#       name: assistant-kustomize    # this repo's published bundle
#     kubeConfig:
#       secretRef:
#         name: milo-configuration-kubeconfig   # generated by the
#                                               # datum-control-plane-system
#                                               # kustomization
#     dependsOn:
#       - name: milo-apiserver
#         namespace: datum-system
#     path: milo/            # i.e. THIS directory
#     prune: true
#     wait: true
#
# Without that kubeConfig the manifests apply to the workload cluster, where a
# ProtectedResource has no controller and an iam.miloapis.com Role is not even a
# registered kind — so a wrong target fails loudly for the IAM objects, but the
# CRD below would apply cleanly to the wrong cluster and be silently useless.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  # The CapabilityBinding CRD, applied to MILO ROOT — once, cluster-wide — and
  # not to the assistant's workload cluster (where it lived until 2026-09).
  #
  # Milo exempts apiextensions.k8s.io/customresourcedefinitions from its
  # project-partitioning storage decorator
  # (milo/internal/apiserver/storage/project/restoptions.go:35-38: "Leave CRD
  # *definitions* global so discovery is shared cluster-wide") while wrapping
  # every other resource. Definitions are therefore global and only INSTANCE
  # data is per-project: one registration here makes the kind discoverable in
  # every project control plane, and the objects themselves stay partitioned per
  # project, which is the tenancy property the capability source relies on.
  #
  # It is a `resources` entry rather than a component because a CRD is a plain
  # cluster object; nothing about it is conditional on an overlay.
  - ../crd

components:
  - iam/
  - rbac/
