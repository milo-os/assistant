# Conversation store (durable): a CloudNativePG-managed PostgreSQL cluster
# backing the assistant's conversation/message history (CONVERSATION_STORE_URL).
#
# The CNPG operator (vendored in this directory, installed
# by playground-up.sh into cnpg-system) owns provisioning: PVC, credentials,
# services, and restart/failover handling. It creates the app credentials
# Secret `conversation-store-app`, whose `uri` key is exactly the
# CONVERSATION_STORE_URL the assistant consumes (via 70-assistant.tmpl.yaml).
#
# Single instance on purpose: this is a playground on a shared kind node —
# durability across pod restarts is the goal (PVC-backed), not HA. Production
# posture raises `instances` and adds backup/PITR via CNPG's native support;
# the assistant is untouched either way (it just follows the -rw service URI).
#
# Data survives assistant AND postgres pod restarts — the playground proof:
# chat, restart the assistant, ask "what did I say?".
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: conversation-store
  namespace: patch-playground
  labels:
    app: conversation-store
    app.kubernetes.io/part-of: agent-framework-playground
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.8
  imagePullPolicy: IfNotPresent
  bootstrap:
    initdb:
      database: conversations
      owner: patch
  storage:
    storageClass: standard
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }
