# CloudNativePG, installed via Flux like every other shared operator
# (cert-manager, Envoy Gateway, the AI Gateway) rather than from a vendored
# manifest applied out-of-band. Flux reconciles and drift-corrects it, and the
# chart owns its own CRDs — which also removes the reason the old path needed
# `kubectl apply --server-side` (the vendored CRDs exceeded client-side apply's
# annotation limit).
#
# releaseName is pinned so the chart's resource names stay predictable:
# without it Flux derives `<targetNamespace>-<name>`, which would rename the
# webhook Service the deploy waits on.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 15m
  timeout: 5m
  releaseName: cnpg
  targetNamespace: cnpg-system
  chartRef:
    kind: OCIRepository
    name: cnpg
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
