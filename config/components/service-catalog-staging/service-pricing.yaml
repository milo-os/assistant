# Staging pass-through for the portal assistant. Rates are Anthropic's
# published list prices for claude-sonnet-4-6, the model staging runs:
# $3 / $15 per million input / output tokens, cache reads at $0.30,
# 5-minute cache writes at $3.75. The assistant uses ephemeral prompt
# cache (5 minute TTL). Match on model so a later model switch does not
# silently bill at these rates. Do not add an unmatched catch-all;
# Amberflo cannot represent that beside matched rates. Messages stay
# unpriced; Anthropic does not bill per message.
#
# A ServicePricing's spec is immutable once created. To change a rate,
# add a new pricing with the next version suffix (e.g. -v2) and point
# the Offers at it.
apiVersion: billing.miloapis.com/v1alpha1
kind: ServicePricing
metadata:
  name: assistant-input-tokens-v1
  namespace: milo-system
spec:
  chargeType: Usage
  serviceRef: assistant.miloapis.com
  currency: USD
  displayName: Input tokens
  metric: assistant.miloapis.com/conversation/input-tokens
  pricingUnit: token
  rates:
    - match: { dimension: model, value: claude-sonnet-4-6 }
      flat: "0.000003"
---
apiVersion: billing.miloapis.com/v1alpha1
kind: ServicePricing
metadata:
  name: assistant-output-tokens-v1
  namespace: milo-system
spec:
  chargeType: Usage
  serviceRef: assistant.miloapis.com
  currency: USD
  displayName: Output tokens
  metric: assistant.miloapis.com/conversation/output-tokens
  pricingUnit: token
  rates:
    - match: { dimension: model, value: claude-sonnet-4-6 }
      flat: "0.000015"
---
apiVersion: billing.miloapis.com/v1alpha1
kind: ServicePricing
metadata:
  name: assistant-cache-read-tokens-v1
  namespace: milo-system
spec:
  chargeType: Usage
  serviceRef: assistant.miloapis.com
  currency: USD
  displayName: Cached prompt tokens
  metric: assistant.miloapis.com/conversation/cache-read-tokens
  pricingUnit: token
  rates:
    - match: { dimension: model, value: claude-sonnet-4-6 }
      flat: "0.0000003"
---
apiVersion: billing.miloapis.com/v1alpha1
kind: ServicePricing
metadata:
  name: assistant-cache-write-tokens-v1
  namespace: milo-system
spec:
  chargeType: Usage
  serviceRef: assistant.miloapis.com
  currency: USD
  displayName: Prompt cache storage
  metric: assistant.miloapis.com/conversation/cache-write-tokens
  pricingUnit: token
  rates:
    - match: { dimension: model, value: claude-sonnet-4-6 }
      flat: "0.00000375"
